<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#faf8f2"/><g font-family="Arial,sans-serif" font-size="20" fill="#153d30"><text x="35" y="40" font-weight="bold">UC-AUTH-05 · OtpService.request</text><text x="35" y="75" font-size="17">Kiểm input/phiên/quyền → lỗi: từ chối và rollback (OTP sai: lưu attempts)</text><rect x="35" y="100" width="930" height="88" rx="12" fill="white" stroke="#198754"/><text x="55" y="132">1. Giới hạn IP/email/cooldown</text><path d="M500 188v22m-6-7 6 7 6-7" fill="none" stroke="#198754" stroke-width="2"/><rect x="35" y="215" width="930" height="88" rx="12" fill="white" stroke="#198754"/><text x="55" y="247">2. challenge PASSWORD_RESET kể cả email không tồn tại</text><path d="M500 303v22m-6-7 6 7 6-7" fill="none" stroke="#198754" stroke-width="2"/><rect x="35" y="330" width="930" height="88" rx="12" fill="white" stroke="#198754"/><text x="55" y="362">3. gửi SMTP</text><path d="M500 418v22m-6-7 6 7 6-7" fill="none" stroke="#198754" stroke-width="2"/><rect x="35" y="445" width="930" height="88" rx="12" fill="white" stroke="#198754"/><text x="55" y="477">4. trả phản hồi chung</text><text x="35" y="602" font-size="16">Nguồn code thực · 17/10/2026 · H2 test; provider/integration nghiệm thu riêng</text></g></svg>