spring.application.name=UTETra
spring.profiles.active=mysql
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# Internal JSP/SiteMesh forwards are already authorized on the original request.
# Keep the strict firewall on external requests, without re-filtering decorator forwards.
spring.security.filter.dispatcher-types=request,async,error
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
app.time-zone=Asia/Ho_Chi_Minh
app.base-url=http://localhost:8080
app.cookie.secure=false

